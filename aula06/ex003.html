<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa em JS</title>
    <style>
        body {
            background-color: greenyellow;
            color: white;
            font: normal 18pt Arial;
        }
        h1 {
            color: rgb(90, 90, 131);
        }
        
        p {
            font: normal 14pt Arial
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei</p>
    <script>
        var n1 = Number.parseFloat( window.prompt("Digite um numero"))//float qnd for quebrado
        var n2 = Number.parseInt(window.prompt("Digite outro numero"))//int usa quando for inteiro
        var n3 = n1 + n2
        window.alert("A soma dos numeros que você digitou é:" + n3)
    </script>
</body>
</html>
